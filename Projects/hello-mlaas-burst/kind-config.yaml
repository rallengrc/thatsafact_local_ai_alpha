# kind-config.yaml — Multi-Node Kubernetes in Docker (KinD) Cluster
# Optimized for MLaaS Semi-Deep Architecture Testing on macOS (Apple Silicon)
#
# Topology: 4 Nodes
# • 1 Control-Plane Node (Kubernetes API server, scheduler, etcd)
# • 1 Platform Infra Worker (FlyteAdmin, MinIO, PostgreSQL, KubeRay Controller)
# • 1 Ray Head Worker (Ray Head Pod, Ray GCS, Dashboard)
# • 1 Burstable Compute Worker (Ray Workers, Karpenter GPU-burst simulation)
#
# Usage:
#   kind create cluster --name mlaas-burst --config kind-config.yaml
#   kind delete cluster --name mlaas-burst
#
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: mlaas-burst
nodes:
  # --------------------------------------------------------------------------
  # 1. Control Plane Node
  # --------------------------------------------------------------------------
  - role: control-plane
    image: kindest/node:v1.30.0
    extraPortMappings:
      # Forward Flyte Console / UI to localhost:30080
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      # Forward Ray Dashboard to localhost:8265
      - containerPort: 8265
        hostPort: 8265
        protocol: TCP
      # Forward MinIO S3 Console to localhost:30090
      - containerPort: 30090
        hostPort: 30090
        protocol: TCP

  # --------------------------------------------------------------------------
  # 2. Platform Infrastructure Worker (Flyte Core, MinIO, DB, KubeRay)
  # --------------------------------------------------------------------------
  - role: worker
    image: kindest/node:v1.30.0
    labels:
      topology.kubernetes.io/zone: local-a
      node.kubernetes.io/role: platform-infra
      mlaas.io/tier: platform

  # --------------------------------------------------------------------------
  # 3. Ray Head Coordinator Worker (Ray Head Pod, GCS, Dashboard)
  # --------------------------------------------------------------------------
  - role: worker
    image: kindest/node:v1.30.0
    labels:
      topology.kubernetes.io/zone: local-a
      node.kubernetes.io/role: ray-head
      role: mlaas-head-node
      mlaas.io/tier: compute-coordinator

  # --------------------------------------------------------------------------
  # 4. Burstable Compute Worker (Simulated Karpenter GPU Node Pool)
  # --------------------------------------------------------------------------
  - role: worker
    image: kindest/node:v1.30.0
    labels:
      topology.kubernetes.io/zone: local-b
      node.kubernetes.io/role: ray-worker
      karpenter.sh/nodepool: gpu-burst
      mlaas.io/tier: burst-compute
    # Simulated GPU label to allow RayJob GPU pods to schedule on CPU in local dev
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "accelerator=simulated-gpu,karpenter.sh/nodepool=gpu-burst"
